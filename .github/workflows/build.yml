name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make pkg-config libbpf-dev libelf-dev zlib1g-dev \
            linux-tools-common linux-tools-$(uname -r)
      - name: Build
        run: make
